# Weekly, grouped, so one maintainer gets a few PRs a week instead of twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # Node majors are a deliberate move from one LTS to the next (24 -> 26), not an automatic bump:
      # odd majors are short-lived, and the Dockerfile, CI and .nvmrc must move together.
      - dependency-name: node
        update-types: [version-update:semver-major]
