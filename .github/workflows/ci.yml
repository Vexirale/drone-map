name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scan
          POSTGRES_PASSWORD: scan
          POSTGRES_DB: scan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scan -d scan_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://scan:scan@localhost:5432/scan_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scan
          POSTGRES_PASSWORD: scan
          POSTGRES_DB: scan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scan -d scan"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://scan:scan@localhost:5432/scan_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
          include-hidden-files: true

  docker:
    name: Docker images
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
